<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pre- és posztnatális tréning — Mamas & Minis</title><style>.instagram{background:#fff;color:#101828;padding-block:clamp(30px,5vw,65px)}
.ig-profile{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.ig-profile h2{font:650 17px/1.35 system-ui,sans-serif}
.ig-profile p{font-size:13px}
.ig-avatar{width:54px;height:54px;border-radius:50%;background:#dfcfc0;flex:none}
.ig-follow{margin-left:auto;background:#155eef;color:#fff;padding:8px 18px;border-radius:6px;font-size:13px;font-weight:650}
.ig-slider{position:relative}
.ig-track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 20px)/3);gap:10px;overflow:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.ig-track::-webkit-scrollbar{display:none}
.ig-post{aspect-ratio:1;background:#dfcfc0;scroll-snap-align:start}
.ig-post:nth-child(even){background:#c7b7a7}
.ig-slider button{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:#101828;color:#fff;font:27px/1 system-ui;cursor:pointer}
.ig-slider button:disabled{opacity:.35;cursor:default}
.ig-prev{left:8px}
.ig-next{right:8px}

:root{--paper:#ede3d8;--ink:#282119;--sand:#dfcfc0;--line:#a89786}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 Arial,Helvetica,sans-serif}
h1,h2,h3,p{margin:0}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid currentColor;outline-offset:5px}
.wrap{width:min(100% - 80px,1360px);margin-inline:auto}
header{display:flex;align-items:center;justify-content:space-between;padding-block:22px;gap:20px}
.logo{font-size:21px;font-weight:800;letter-spacing:-1px;line-height:1}
.logo span{font-family:Georgia,serif;font-style:italic;font-weight:400}
nav{display:flex;align-items:center;gap:30px;font-size:12px}
.text-link{border-bottom:1px solid;padding-bottom:3px}
.hero{border-top:1px solid var(--line);padding-top:25px}
.micro{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
.hero-top{display:flex;justify-content:space-between}
.hero h1{font-size:clamp(62px,11.6vw,170px);line-height:.88;letter-spacing:-.085em;font-weight:600;margin:32px 0 30px}
.hero h1 em{font:italic 1.08em/.8 Georgia,serif;letter-spacing:-.075em}
.hero-bottom{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:end;margin-bottom:28px}
.hero-bottom p{max-width:36ch;font-size:18px;line-height:1.4}
.pill{display:inline-flex;gap:30px;align-items:center;justify-content:space-between;padding:14px 22px;border-radius:50px;background:var(--ink);color:var(--paper);font-size:12px;width:fit-content}
.hero-bottom .pill{justify-self:end}
.pill:hover{background:#514438}
.image-slot{background:#c7b7a7}
.hero-photo{height:clamp(240px,29vw,430px);background:#b7a593}
.hero-caption{display:flex;justify-content:space-between;padding-block:12px;border-bottom:1px solid var(--line)}
.intro{display:grid;grid-template-columns:1fr 2fr;gap:40px;padding-block:100px}
.intro h2{font-size:clamp(29px,4vw,56px);letter-spacing:-.055em;line-height:1.14;font-weight:400;max-width:25ch}
.intro p{max-width:51ch;margin-top:22px}
.programs{background:var(--ink);color:var(--paper);padding-block:60px 70px}
.program-heading{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:42px}
.program-heading h2{font-size:clamp(40px,6vw,86px);line-height:1;letter-spacing:-.065em;font-weight:400}
.program-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.program{border-top:1px solid #877565;padding-top:13px}
.program .image-slot{aspect-ratio:1.2;margin:18px 0 21px}
.program:nth-child(2){padding-top:13px;margin-top:65px}
.program:nth-child(2) .image-slot{background:#b9aa9b}
.program:nth-child(3){margin-top:130px}
.program:nth-child(3) .image-slot{background:#ad9e90}
.program h3{font-size:clamp(25px,3vw,42px);font-weight:400;letter-spacing:-.05em;line-height:1.05;margin-bottom:13px}
.program p{font-size:14px;max-width:34ch;color:#dfcfc0}
.program a{display:flex;justify-content:space-between;border-top:1px solid #877565;margin-top:24px;padding-top:12px;font-size:12px}
.about{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(30px,8vw,120px);padding-block:100px;align-items:center}
.about-photo{aspect-ratio:.9;background:#b9a794}
.about h2{font-size:clamp(42px,6vw,84px);line-height:1;letter-spacing:-.06em;font-weight:400;margin:19px 0 26px}
.about h2 em{font-family:Georgia,serif;font-weight:400}
.about .bio{max-width:43ch}
.expertise{list-style:none;padding:0;margin:30px 0 0;border-top:1px solid var(--line)}
.expertise li{padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.join{background:var(--sand);padding-block:65px}
.join-inner{display:grid;grid-template-columns:1.6fr 1fr;gap:40px;align-items:end}
.join h2{font-size:clamp(45px,8vw,112px);line-height:.94;letter-spacing:-.075em;font-weight:400;margin-top:20px}
.join h2 em{font-family:Georgia,serif;font-weight:400}
.join p{max-width:34ch;margin-bottom:20px}
footer{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-block:28px}
.footer-note{font-size:10px;letter-spacing:.12em}
@media(max-width:780px){
.wrap{width:calc(100% - 36px)}
nav{gap:15px}
.hero h1{font-size:clamp(54px,12.4vw,98px)}
.intro{grid-template-columns:1fr;gap:20px;padding-block:56px}
.program-grid{gap:16px}
.program:nth-child(2){margin-top:35px}
.program:nth-child(3){margin-top:70px}
.about{padding-block:56px;gap:25px}
}
@media(max-width:580px){
header{flex-wrap:wrap;padding-block:18px}nav{width:100%;justify-content:space-between}
.hero-top .micro:last-child{display:none}
.hero-bottom,.program-grid,.about,.join-inner{grid-template-columns:1fr}
.hero-bottom .pill{justify-self:start}
.hero-bottom p{font-size:16px}
.program:nth-child(2),.program:nth-child(3){margin-top:18px}
.program .image-slot{aspect-ratio:1.6}
.programs{padding-block:38px}
.program-heading{align-items:start;flex-direction:column;gap:10px;margin-bottom:25px}
.about-photo{aspect-ratio:1.1}
.join{padding-block:42px}
footer{align-items:start;flex-direction:column}
.ig-track{grid-auto-columns:calc((100% - 10px)/2)}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.expertise li{padding:0}
.expertise a{display:grid;grid-template-columns:34px 1fr 22px;align-items:center;gap:10px;min-height:61px;padding:8px 2px}
.expertise a:hover{background:#dfcfc0}
.expertise-symbol{width:32px;height:32px}
.expertise-arrow{font-size:22px;line-height:1;text-align:right}
</style>
<style>
.detail{min-height:75vh;padding-block:60px 90px;border-top:1px solid var(--line)}
.detail h1{font-size:clamp(38px,7vw,98px);line-height:1.04;font-weight:400;letter-spacing:-.06em;max-width:16ch;margin:38px 0 24px}
.detail p{max-width:42ch;margin-bottom:28px}
</style></head><body><header class="wrap"><a class="logo" href="/">mamas<span>&</span>minis</a><a class="text-link" href="/#fanni">Vissza Fannihoz ↗</a></header>

<footer class="wrap"><a class="logo" href="/">mamas<span>&</span>minis</a><p class="footer-note">MOZGÁS · ERŐ · KÖZÖSSÉG</p></footer></body></html>
